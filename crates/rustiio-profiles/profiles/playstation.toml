# PlayStation 3/4/5 kao DLNA klijent.
id = "playstation"
name = "PlayStation"
description = "PS3/PS4/PS5: H.264 do 1080p (PS4/5 i HEVC), strogo oko PN-a."

[match]
user_agent = ["PLAYSTATION", "PlayStation", "PS3", "PS4", "PS5"]
friendly_name = ["PLAYSTATION", "PlayStation"]

[video]
containers = ["mp4", "mkv", "ts", "m2ts", "avi", "mpg"]
codecs = ["h264", "hevc", "mpeg2video", "mpeg4"]
max_width = 1920
max_height = 1080
max_bitrate_kbps = 25000

[audio]
codecs = ["aac", "mp3", "ac3", "dts", "flac"]
max_channels = 6

[transcode]
container = "mpegts"
video_codec = "h264"
audio_codec = "ac3"
audio_channels = 2
max_bitrate_kbps = 12000

[dlna]
send_pn = false
op = "01"
