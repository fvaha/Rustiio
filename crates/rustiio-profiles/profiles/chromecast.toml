# Chromecast / Google Cast (i "cast" iz Chromea).
id = "chromecast"
name = "Chromecast / Cast"
description = "Cast uredjaji: H.264/VP8/VP9, bez HEVC-a na starijim, 1080p."

[match]
user_agent = ["CrKey", "Chromecast", "CastWeb"]
friendly_name = ["Chromecast", "Google Home", "Nest"]

[video]
containers = ["mp4", "webm", "mkv", "ts"]
codecs = ["h264", "vp8", "vp9", "hevc"]
max_width = 1920
max_height = 1080
max_bitrate_kbps = 20000

[audio]
codecs = ["aac", "mp3", "opus", "vorbis", "ac3", "eac3", "flac"]
max_channels = 6

[subtitles]
mode = "soft"
formats = ["vtt", "srt"]

[transcode]
container = "mp4"
video_codec = "h264"
audio_codec = "aac"
audio_channels = 2
max_bitrate_kbps = 10000
