# Sharp AQUOS (ukljucujuci starije Aquos TV-e i BD playere).
id = "sharp-aquos"
name = "Sharp AQUOS"
description = "AQUOS: H.264 do 1080p, srt titlovi, osjetljiv na redoslijed u DIDL-u."

[match]
user_agent = ["Sharp", "AQUOS", "SHARP"]
friendly_name = ["AQUOS", "Sharp"]

[video]
containers = ["mp4", "mkv", "ts", "m2ts", "avi", "mpg", "vob"]
codecs = ["h264", "mpeg2video", "mpeg4"]
max_width = 1920
max_height = 1080
max_bitrate_kbps = 20000

[audio]
codecs = ["aac", "mp3", "ac3", "dts"]
max_channels = 6

[subtitles]
mode = "soft"
formats = ["srt"]

[transcode]
container = "mpegts"
video_codec = "h264"
audio_codec = "ac3"
audio_channels = 2
max_bitrate_kbps = 10000
