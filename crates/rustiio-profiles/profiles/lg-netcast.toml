# LG NetCast (2011–2013) — prije webOS-a.
id = "lg-netcast"
name = "LG TV (NetCast)"
description = "Stariji LG: H.264 do 1080p, bez HEVC-a."

[match]
user_agent = ["NetCast", "LG NetCast"]
friendly_name = ["LG"]

[video]
containers = ["mp4", "mkv", "ts", "m2ts", "avi", "divx"]
codecs = ["h264", "mpeg2video", "mpeg4"]
max_width = 1920
max_height = 1080
max_bitrate_kbps = 20000

[audio]
codecs = ["aac", "mp3", "ac3", "dts"]
max_channels = 6

[transcode]
container = "mpegts"
video_codec = "h264"
audio_codec = "ac3"
audio_channels = 2
max_bitrate_kbps = 10000
