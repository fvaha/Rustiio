# Panasonic VIERA.
id = "panasonic-viera"
name = "Panasonic VIERA"
description = "VIERA: H.264 do 1080p, HEVC na novijim modelima, osjetljivi na mkv."

[match]
user_agent = ["Panasonic", "VIERA", "DMP-", "DMR-"]
friendly_name = ["VIERA", "Panasonic"]

[video]
containers = ["mp4", "mkv", "ts", "m2ts", "avi", "mpg"]
codecs = ["h264", "mpeg2video", "hevc", "mpeg4"]
max_width = 1920
max_height = 1080
max_bitrate_kbps = 25000

[audio]
codecs = ["aac", "mp3", "ac3", "eac3", "dts"]
max_channels = 6

[subtitles]
mode = "soft"
formats = ["srt"]

[transcode]
container = "mpegts"
video_codec = "h264"
audio_codec = "ac3"
audio_channels = 2
max_bitrate_kbps = 12000
