# Plex klijenti (Plex for Samsung/LG, Plex Media Player, Plexamp).
id = "plex-client"
name = "Plex klijent"
description = "Plex klijenti: H.264/HEVC, 4K na novijima, 8 kanala."

[match]
user_agent = ["Plex", "PlexMediaPlayer", "Plex for"]
friendly_name = ["Plex"]

[video]
containers = ["mp4", "mkv", "ts", "mov", "avi", "webm"]
codecs = ["h264", "hevc", "vp9", "av1", "mpeg2video", "mpeg4"]
max_width = 3840
max_height = 2160
max_bit_depth = 10
max_bitrate_kbps = 80000

[audio]
codecs = ["aac", "mp3", "ac3", "eac3", "dts", "flac", "opus", "vorbis"]
max_channels = 8

[subtitles]
mode = "soft"
formats = ["srt", "vtt", "ass"]

[transcode]
container = "mp4"
video_codec = "h264"
audio_codec = "aac"
audio_channels = 2
max_bitrate_kbps = 20000
