# Rustiio u Dockeru.
#
# VAŽNO: `network_mode: host` je obavezan — SSDP (UDP 1900, multicast 239.255.255.250)
# ne prolazi kroz Docker bridge, pa TV-i ne bi vidjeli server. Zato nema port mappinga.
services:
  rustiio:
    build: .
    image: rustiio:latest
    container_name: rustiio
    network_mode: host
    restart: unless-stopped
    environment:
      RUSTIIO_CONFIG_DIR: /config
      RUST_LOG: info
      # TMDB kljuc za postere. Vrijednost drzi u .env (nije u gitu); prazno = keyless izvori.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - ./deploy/config:/config
      # Medijske mape s hosta — prilagodi svojima (read-only je dovoljno).
      - /path/to/your/media:/media:ro
    # GPU za transcode (NVENC/VAAPI/QSV). Bez ovoga ffmpeg u kontejneru
    # vidi samo softverski libx264. Treba nvidia-container-toolkit na hostu.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
