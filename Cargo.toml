[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["vaha"]
repository = "https://github.com/fvaha/rustiio"

[workspace.dependencies]
rustiio-core = { path = "crates/rustiio-core" }
rustiio-ssdp = { path = "crates/rustiio-ssdp" }
rustiio-upnp = { path = "crates/rustiio-upnp" }
rustiio-library = { path = "crates/rustiio-library" }
rustiio-cds = { path = "crates/rustiio-cds" }
rustiio-http = { path = "crates/rustiio-http" }
rustiio-server = { path = "crates/rustiio-server" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "io-util",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quick-xml = "0.38"
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
httpdate = "1"
hostname = "0.4"
percent-encoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
